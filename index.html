<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Soteria: HHK Rabin KEM</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; max-width: 980px; margin: auto; }
    h2 { color: #569cd6; margin-bottom: 6px; }
    p.subtitle { color: #858585; margin-top: 0; }
    code { color: #ce9178; }
    .box { background: #252526; border: 1px solid #454545; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
    .label { color: #ce9178; font-weight: bold; margin-bottom: 6px; }
    .value { word-break: break-all; color: #b5cea8; font-size: 12px; }
    .success { color: #4ec9b0; font-weight: bold; }
    .error { color: #f14c4c; font-weight: bold; }
    button { background: #0e639c; color: white; border: none; padding: 10px 15px; font-size: 14px; cursor: pointer; border-radius: 2px; margin-right: 10px; }
    button:hover { background: #1177bb; }
    #log { white-space: pre-wrap; background: #121212; padding: 10px; border: 1px solid #333; color: #4ec9b0; margin-top: 15px; min-height: 42px; }
  </style>
</head>
<body>

  <h2>Soteria: HHK Rabin KEM</h2>
  <p class="subtitle">Uses browser-native RSA key generation + Tonelli-Shanks root finding.</p>

  <button onclick="runKemDemo(false)">Run Honest Exchange</button>
  <button onclick="runKemDemo(true)">Run Tampered CCA Exchange</button>

  <div id="output" style="margin-top: 20px;"></div>
  <div id="log">Status: Idle.</div>

  <script>
    "use strict";

    const PRIME_BITS = 2048; 
    const SEED_BYTES = 32;

    const enc = new TextEncoder();
    let paramsPromise = null;
    let busy = false;

    function logStatus(msg) { document.getElementById("log").textContent = "Status: " + msg; }
    function tick() { return new Promise(resolve => setTimeout(resolve, 0)); }

    function modPow(base, exp, mod) {
      let res = 1n; base = base % mod;
      while (exp > 0n) {
        if (exp & 1n) res = (res * base) % mod;
        base = (base * base) % mod; exp >>= 1n;
      }
      return res;
    }

    function cryptoRandomBigInt(bits) {
      const bytes = new Uint8Array(Math.ceil(bits / 8));
      crypto.getRandomValues(bytes);
      let value = 0n;
      for (const byte of bytes) value = (value << 8n) | BigInt(byte);
      return value;
    }

    function bytesToBigIntBE(bytes, start, length) {
      let value = 0n; const end = start + length;
      for (let i = start; i < end; i++) value = (value << 8n) | BigInt(bytes[i]);
      return value;
    }

    function bigIntToBytesBE(val, byteLen) {
      const out = new Uint8Array(byteLen); let temp = val;
      for (let i = byteLen - 1; i >= 0; i--) { out[i] = Number(temp & 0xffn); temp >>= 8n; }
      return out;
    }

    function bytesToHex(bytes) { return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join(""); }

    function extGcd(a, b) {
      let x0 = 1n, x1 = 0n, y0 = 0n, y1 = 1n;
      while (b !== 0n) {
        const q = a / b; const r = a % b; a = b; b = r;
        const nx = x0 - q * x1; x0 = x1; x1 = nx;
        const ny = y0 - q * y1; y0 = y1; y1 = ny;
      }
      return [x0, y0, a];
    }

    async function hkdfSha256(ikmBytes, saltBytes, infoBytes, lengthBytes) {
      const key = await crypto.subtle.importKey("raw", ikmBytes, "HKDF", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits(
        { name: "HKDF", hash: "SHA-256", salt: saltBytes, info: infoBytes }, key, lengthBytes * 8
      );
      return new Uint8Array(bits);
    }

    // FIXED: Properly handles Base64Url padding before atob()
    function base64UrlToBigInt(b64url) {
      let b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4) {
        b64 += "=";
      }
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytesToBigIntBE(bytes, 0, bytes.length);
    }

    async function generateParams() {
      logStatus("Generating 4096-bit RSA via native browser crypto...");
      await tick();
      
      // THE CHEAT CODE: Generate standard RSA key pair in native C++/Rust code
      const keyPair = await crypto.subtle.generateKey(
        { 
          name: "RSASSA-PKCS1-v1_5", 
          modulusLength: 4096, 
          publicExponent: new Uint8Array([0x01, 0x00, 0x01]), // FIXED: Standard 65537
          hash: "SHA-256" 
        },
        true, // Extractable!
        ["sign", "verify"]
      );
      
      const jwk = await crypto.subtle.exportKey("jwk", keyPair.privateKey);
      
      const p = base64UrlToBigInt(jwk.p);
      const q = base64UrlToBigInt(jwk.q);
      const N = p * q;
      
      const [qInvRaw] = extGcd(q, p);
      const qInv = ((qInvRaw % p) + p) % p;
      
      const sigmaSecret = crypto.getRandomValues(new Uint8Array(SEED_BYTES));
      logStatus("4096-bit parameters extracted from native RSA key.");
      await tick();
      
      return { p, q, N, qInv, sigmaSecret };
    }

    function getParams() {
      if (!paramsPromise) paramsPromise = generateParams();
      return paramsPromise;
    }

    async function encodeMessage(seedBytes, N) {
      const bitLen = N.toString(2).length;
      const byteLen = Math.ceil(bitLen / 8); 
      const padLen = byteLen - 1 - SEED_BYTES;
      const salt = enc.encode("RabinKEM-Salt-Native");
      const info = enc.encode("RabinKEM-Pad-Native");
      const padBytes = await hkdfSha256(seedBytes, salt, info, padLen);
      
      const mBytes = new Uint8Array(byteLen);
      mBytes[0] = 0x00;
      mBytes.set(seedBytes, 1);
      mBytes.set(padBytes, 1 + SEED_BYTES);
      
      return bytesToBigIntBE(mBytes, 0, byteLen);
    }

    async function decodeMessage(M, N) {
      const bitLen = N.toString(2).length;
      const byteLen = Math.ceil(bitLen / 8);
      const mBytes = bigIntToBytesBE(M, byteLen);
      if (mBytes[0] !== 0x00) return null;
      
      const seed = mBytes.slice(1, 1 + SEED_BYTES);
      const padBytes = mBytes.slice(1 + SEED_BYTES);
      const padLen = byteLen - 1 - SEED_BYTES;
      
      const salt = enc.encode("RabinKEM-Salt-Native");
      const info = enc.encode("RabinKEM-Pad-Native");
      const expectedPad = await hkdfSha256(seed, salt, info, padLen);
      
      for (let i = 0; i < padLen; i++) {
        if (padBytes[i] !== expectedPad[i]) return null;
      }
      return seed;
    }

    // Tonelli-Shanks algorithm to find square roots modulo ANY prime
    function tonelliShanks(n, p) {
      if (n === 0n) return 0n;
      if (modPow(n, (p - 1n) / 2n, p) !== 1n) return null; // Euler's criterion: no root exists

      let Q = p - 1n;
      let S = 0n;
      while (Q % 2n === 0n) { Q /= 2n; S += 1n; }

      if (S === 1n) return modPow(n, (p + 1n) / 4n, p); // Fast path if p = 3 mod 4

      let z = 2n;
      while (modPow(z, (p - 1n) / 2n, p) !== p - 1n) z += 1n;

      let M = S;
      let c = modPow(z, Q, p);
      let t = modPow(n, Q, p);
      let R = modPow(n, (Q + 1n) / 2n, p);

      while (true) {
        if (t === 0n) return 0n;
        if (t === 1n) return R;

        let i = 0n;
        let temp = t;
        while (temp !== 1n) {
          temp = (temp * temp) % p;
          i += 1n;
        }

        let b = c;
        for (let j = 0n; j < M - i - 1n; j++) b = (b * b) % p;

        M = i;
        c = (b * b) % p;
        t = (t * c) % p;
        R = (R * b) % p;
      }
    }

    async function encrypt(seedBytes, N) {
      const M = await encodeMessage(seedBytes, N);
      return (M * M) % N;
    }

    async function decrypt(c, p, q, N, qInv) {
      c = ((c % N) + N) % N;
      
      const mp = tonelliShanks(c % p, p);
      const mq = tonelliShanks(c % q, q);
      
      if (mp === null || mq === null) return { seed: null, isValid: false }; 

      const rps = [mp, p - mp];
      const rqs = [mq, q - mq];

      for (const rp of rps) {
        for (const rq of rqs) {
          let diff = ((rp - rq) % p + p) % p;
          let h = (qInv * diff) % p;
          let root = rq + h * q;
          
          if ((root * root) % N !== c) continue;

          const seed = await decodeMessage(root, N);
          if (seed !== null) {
            return { seed, isValid: true };
          }
        }
      }
      return { seed: null, isValid: false };
    }

    async function deriveSessionKey(secretBytes, c, N) {
      const bitLen = N.toString(2).length;
      const byteLen = Math.ceil(bitLen / 8);
      const nBytes = bigIntToBytesBE(N, byteLen);
      const cBytes = bigIntToBytesBE(c, byteLen);

      const transcript = new Uint8Array(nBytes.length + cBytes.length);
      transcript.set(nBytes, 0);
      transcript.set(cBytes, nBytes.length);
      
      const transcriptHash = new Uint8Array(await crypto.subtle.digest("SHA-256", transcript));
      const salt = new Uint8Array(32);
      const key = await crypto.subtle.importKey("raw", secretBytes, "HKDF", false, ["deriveBits"]);
      const prkBits = await crypto.subtle.deriveBits({ name: "HKDF", hash: "SHA-256", salt: salt, info: new Uint8Array(0) }, key, 256);
      
      const prkKey = await crypto.subtle.importKey("raw", prkBits, "HKDF", false, ["deriveBits"]);
      const okmBits = await crypto.subtle.deriveBits({ name: "HKDF", hash: "SHA-256", salt: new Uint8Array(0), info: transcriptHash }, prkKey, 256);

      return bytesToHex(new Uint8Array(okmBits));
    }

    async function runKemDemo(shouldTamper) {
      if (busy) return;
      busy = true;
      try {
        document.getElementById("output").innerHTML = "";
        const params = await getParams();
        const { p, q, N, qInv, sigmaSecret } = params;
        const byteLen = Math.ceil(N.toString(2).length / 8);

        logStatus("Encapsulating...");
        const seed = crypto.getRandomValues(new Uint8Array(SEED_BYTES));
        const c = await encrypt(seed, N);
        let cTransmitted = c;
        const bobSessionKey = await deriveSessionKey(seed, c, N);

        if (shouldTamper) {
          logStatus("Tampering...");
          cTransmitted = (cTransmitted + 1n) % N;
        } else {
          logStatus("Decapsulating...");
        }

        const decResult = await decrypt(cTransmitted, p, q, N, qInv);

        let aliceSessionKey;
        if (decResult.isValid) {
          aliceSessionKey = await deriveSessionKey(decResult.seed, cTransmitted, N);
        } else {
          aliceSessionKey = await deriveSessionKey(sigmaSecret, cTransmitted, N);
        }

        const keysMatch = bobSessionKey === aliceSessionKey;
        logStatus(`Done. Match: ${keysMatch}.`);

        const cHex = cTransmitted.toString(16).padStart(byteLen * 2, "0");
        const cDisplay = cHex.length > 96 ? cHex.slice(0, 96) + "…" : cHex;

        document.getElementById("output").innerHTML = `
          <div class="box">
            <div class="label">Native Speed Optimizations</div>
            <div>1. KeyGen: WebCrypto native C++ engine (RSA-4096)</div>
            <div>2. Decryption: Tonelli-Shanks for ANY prime (not just Blum)</div>
          </div>
          <div class="box">
            <div class="label">Encapsulation</div>
            <div>Ciphertext: <span class="value">0x${cDisplay}</span></div>
            <div>Bob Key: <span class="value">${bobSessionKey}</span></div>
          </div>
          <div class="box" style="border-color: ${keysMatch ? "#4ec9b0" : "#f14c4c"};">
            <div class="label">Result</div>
            <div>Alice Key: <span class="value">${aliceSessionKey}</span></div>
            <div>Key Match: <span class="${keysMatch ? "success" : "error"}">${keysMatch}</span></div>
          </div>
        `;
      } catch (err) {
        logStatus("Error: " + (err.message || err));
      } finally {
        busy = false;
      }
    }
  </script>
</body>
</html>
